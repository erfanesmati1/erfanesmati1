<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ERFANULLAH ESMATI — Software Engineering | Cybersecurity</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#071B18"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="halo" cx="600" cy="170" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF99" stop-opacity=".16"/><stop offset="1" stop-color="#00FF99" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="255" x2="0" y2="380">
      <stop offset="0" stop-color="#00FF99" stop-opacity="0"/><stop offset="1" stop-color="#00FF99" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF99" stop-opacity="0"/><stop offset=".5" stop-color="#00FF99" stop-opacity=".9"/><stop offset="1" stop-color="#00FF99" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF99" stop-opacity="0"/><stop offset=".5" stop-color="#00FF99" stop-opacity=".12"/><stop offset="1" stop-color="#00FF99" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="net" stroke="#00FF99" stroke-opacity=".28" stroke-width="1" fill="none">
      <path d="M60 150 L110 70 L230 130 L120 200 L60 150 M110 70 L300 55 L230 130 M230 130 L330 190"/>
      <g fill="#00FF99" stroke="none">
        <circle class="pulse" cx="110" cy="70" r="3.5"/>
        <circle class="pulse d2" cx="230" cy="130" r="3.5"/>
        <circle class="pulse d3" cx="120" cy="200" r="3"/>
        <circle class="pulse d4" cx="300" cy="55" r="3"/>
        <circle class="pulse d2" cx="60" cy="150" r="2.5"/>
        <circle class="pulse d3" cx="330" cy="190" r="2.5"/>
      </g>
    </g>
  </defs>
  <style>
    .pulse{animation:pulse 3.2s ease-in-out infinite;opacity:.4}
    .d2{animation-delay:.8s}.d3{animation-delay:1.6s}.d4{animation-delay:2.4s}
    .sweep{animation:sweep 9s linear infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse,.sweep,.blink{animation:none}.sweep{display:none}}
  </style>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#halo)"/>
  <!-- perspective floor -->
  <g stroke="url(#floor)" stroke-width="1" fill="none">
    <path d="M600 255 L600 380 M600 255 L490 380 M600 255 L710 380 M600 255 L350 380 M600 255 L850 380 M600 255 L180 380 M600 255 L1020 380 M600 255 L-50 380 M600 255 L1250 380"/>
    <path d="M0 262H1200M0 274H1200M0 290H1200M0 312H1200M0 342H1200"/>
  </g>
  <rect x="0" y="254" width="1200" height="2" fill="url(#horizon)"/>
  <!-- network geometry -->
  <use href="#net"/>
  <use href="#net" transform="translate(1200 0) scale(-1 1)"/>
  <rect class="sweep" x="0" y="0" width="400" height="380" fill="url(#sweep)"/>
  <!-- text -->
  <text x="600" y="100" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#00FF99" letter-spacing="2">$ whoami<tspan class="blink">_</tspan></text>
  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="72" font-weight="800" letter-spacing="6" fill="#00FF99" opacity=".45" filter="url(#glow)">ERFANULLAH ESMATI</text>
  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="72" font-weight="800" letter-spacing="6" fill="#FFFFFF">ERFANULLAH ESMATI</text>
  <text x="600" y="224" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="28" letter-spacing="4" fill="#C9D1D9">SOFTWARE ENGINEERING <tspan fill="#00FF99">|</tspan> CYBERSECURITY</text>
</svg>
