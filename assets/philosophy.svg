<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">THINK LIKE AN ENGINEER. OBSERVE LIKE AN ANALYST. LEARN LIKE A BEGINNER. BUILD LIKE A CREATOR. SECURE LIKE A PROFESSIONAL.</title>
  <defs>
