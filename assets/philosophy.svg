    </linearGradient>
  </defs>
  <style>
    .n{font:500 20px Consolas,'Courier New',monospace;fill:#888}
    .s{font:700 38px 'Segoe UI',Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#FFFFFF}
