<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">BUILD / LEARN / ANALYZE / SECURE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/><stop offset=".5" stop-color="#071B18"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF99" stop-opacity="0"/><stop offset=".5" stop-color="#00FF99" stop-opacity=".9"/><stop offset="1" stop-color="#00FF99" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF99" stop-opacity="0"/><stop offset=".5" stop-color="#00FF99" stop-opacity=".12"/><stop offset="1" stop-color="#00FF99" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sw{animation:sw 10s linear infinite}
    @keyframes sw{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
    @media (prefers-reduced-motion:reduce){.sw{display:none}}
  </style>
  <rect width="1200" height="170" fill="url(#bg)"/>
  <rect class="sw" width="400" height="170" fill="url(#sweep)"/>
  <rect y="0" width="1200" height="2" fill="url(#top)"/>
  <text x="600" y="92" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="30" font-weight="700" letter-spacing="8" fill="#FFFFFF">BUILD <tspan fill="#00FF99">/</tspan> LEARN <tspan fill="#00FF99">/</tspan> ANALYZE <tspan fill="#00FF99">/</tspan> SECURE</text>
  <text x="600" y="130" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" letter-spacing="4" fill="#888888">ERFANULLAH ESMATI</text>
</svg>
